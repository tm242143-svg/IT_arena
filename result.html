<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Result</title><link rel="stylesheet" href="css/style.css"></head><body><main class="result"><div class="panel"><div class="badge">FINAL SCORE</div><h1 id="title">Quiz complete.</h1><div class="score" id="score">—</div><p id="detail"></p><div class="hero-actions"><a class="btn primary" href="dashboard.html">Take another quiz</a><a class="btn ghost" href="leaderboard.html">Leaderboard</a></div></div></main><script>const u=new URLSearchParams(location.search);document.getElementById("title").textContent=(u.get("subject")||"Quiz")+" complete!";document.getElementById("score").textContent=(u.get("percentage")||0)+"%";document.getElementById("detail").textContent=`Score: ${u.get("score")||0}/${u.get("total")||0}`;</script></body></html>
