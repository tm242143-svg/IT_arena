<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>MZ Arena | Login</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/mz-theme.css">
    </head>
    <body class="t-login">
        <div class="eng-bg" aria-hidden="true"><i class="art a1"></i><i class="art a2"></i></div>
        <div class="auth-bg"><div class="auth-code">V = I × R</div>
        <div class="page"><div class="panel auth"><img class="auth-logo" src="assets/mzcet-logo.png" alt="MZCET logo"><div class="badge">MZ ARENA · PLAYER LOGIN</div>
        <h1>Welcome <span>back.</span></h1>
        <p>Enter the arena and test your skills.</p>
        <form id="loginForm">
            <input id="email" type="email" placeholder="Email" autocomplete="email" required>
            <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
            <button class="btn primary">Login</button>
            <div id="msg" class="msg"></div>
        </form>
        <a href="register.html">Create student account →</a></div></div></div>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/supabase.js"></script>
        <script src="js/auth.js"></script>
        <footer class="mz-foot">Mount Zion College of Engineering and Technology · Pudukkottai</footer></body></html>
